name: apply-issue9-restart-tests

on:
  pull_request:
    branches: [build/winget-user-execution]
    paths:
      - tools/fix-issue9-restart-tests.py
      - .github/workflows/apply-issue9-restart-tests.yml

permissions:
  contents: write

jobs:
  apply-verify-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: build/winget-user-execution-issue9
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Fix and run restart simulations
        id: gate
        shell: bash
        run: |
          set -o pipefail
          rm -f ISSUE9_RESTART_FAILURE.txt
          {
            python tools/fix-issue9-restart-tests.py
            cargo fmt --all
            cargo clippy --workspace --all-targets -- -D warnings
            cargo test -p toolos-daemon recovery_tests -- --nocapture
            cargo test -p toolos-storage -p toolos-winget
          } 2>&1 | tee /tmp/issue9-restart.log
      - name: Persist failure evidence
        if: failure() && steps.gate.outcome == 'failure'
        run: |
          cp /tmp/issue9-restart.log ISSUE9_RESTART_FAILURE.txt
          git config user.name "ToolOS Build Bot"
          git config user.email "toolos-build-bot@users.noreply.github.com"
          git add apps/toolos-daemon Cargo.lock ISSUE9_RESTART_FAILURE.txt
          git commit -m "Record Issue 9 restart simulation failure"
          git push origin HEAD:build/winget-user-execution-issue9
      - name: Commit verified restart simulations
        if: success()
        run: |
          git config user.name "ToolOS Build Bot"
          git config user.email "toolos-build-bot@users.noreply.github.com"
          git add apps/toolos-daemon/src/recovery_tests.rs
          git commit -m "Keep recovery database fixtures alive through assertions"
          git push origin HEAD:build/winget-user-execution-issue9
