name: apply-issue9-storage

on:
  pull_request:
    branches: [build/winget-user-execution]
    paths:
      - tools/fix-issue9-storage.py
      - crates/toolos-storage/src/recovery.rs
      - crates/toolos-storage/Cargo.toml
      - .github/workflows/apply-issue9-storage.yml

permissions:
  contents: write

jobs:
  apply-verify-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: build/winget-user-execution-issue9
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Apply fixes and verify storage journal
        id: gate
        shell: bash
        run: |
          set -o pipefail
          rm -f ISSUE9_STORAGE_FAILURE.txt
          {
            python tools/fix-issue9-storage.py
            cargo fmt --all
            cargo clippy -p toolos-storage --all-targets -- -D warnings
            cargo test -p toolos-storage
          } 2>&1 | tee /tmp/issue9-storage.log
      - name: Persist failure evidence
        if: failure() && steps.gate.outcome == 'failure'
        run: |
          cp /tmp/issue9-storage.log ISSUE9_STORAGE_FAILURE.txt
          git config user.name "ToolOS Build Bot"
          git config user.email "toolos-build-bot@users.noreply.github.com"
          git add crates/toolos-storage Cargo.lock ISSUE9_STORAGE_FAILURE.txt
          git commit -m "Record Issue 9 storage gate failure"
          git push origin HEAD:build/winget-user-execution-issue9
      - name: Commit verified storage slice
        if: success()
        run: |
          git config user.name "ToolOS Build Bot"
          git config user.email "toolos-build-bot@users.noreply.github.com"
          git rm .github/workflows/apply-issue9-storage.yml
          git rm tools/apply-issue9-storage.py tools/fix-issue9-storage.py
          git rm --ignore-unmatch ISSUE9_STORAGE_FAILURE.txt
          git add crates/toolos-storage Cargo.lock
          git commit -m "Add durable WinGet execution journal storage"
          git push origin HEAD:build/winget-user-execution-issue9
