name: apply-containment-surface

on:
  pull_request:
    branches: [build/winget-user-execution]
    paths:
      - tools/containment-surface.marker

permissions:
  contents: write

jobs:
  apply-and-verify:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: build/windows-job-containment
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Apply surface parity and verify
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          Remove-Item CONTAINMENT_SURFACE_FAILURE.txt -ErrorAction SilentlyContinue
          python tools/apply-containment-surface.py
          python -m json.tool schemas/winget-install-execution.schema.json | Out-Null
          cargo fmt --all
          $output = @()
          $output += (& cargo clippy --workspace --all-targets -- -D warnings 2>&1 | Out-String)
          $exitCode = $LASTEXITCODE
          if ($exitCode -eq 0) {
            $output += (& cargo test --workspace --all-targets -- --nocapture 2>&1 | Out-String)
            $exitCode = $LASTEXITCODE
          }
          if ($exitCode -eq 0) {
            corepack enable
            $output += (& pnpm install --frozen-lockfile 2>&1 | Out-String)
            $exitCode = $LASTEXITCODE
          }
          if ($exitCode -eq 0) {
            $output += (& pnpm --dir apps/toolos-ui check 2>&1 | Out-String)
            $exitCode = $LASTEXITCODE
          }
          if ($exitCode -eq 0) {
            $output += (& pnpm --dir apps/toolos-ui build 2>&1 | Out-String)
            $exitCode = $LASTEXITCODE
          }
          if ($exitCode -eq 0) {
            $output += (& cargo check --manifest-path apps/toolos-ui/src-tauri/Cargo.toml 2>&1 | Out-String)
            $exitCode = $LASTEXITCODE
          }
          if ($exitCode -ne 0) {
            $output | Set-Content CONTAINMENT_SURFACE_FAILURE.txt -Encoding utf8
          }
          git config user.name "ToolOS Build Bot"
          git config user.email "toolos-build-bot@users.noreply.github.com"
          if ($exitCode -eq 0) {
            git rm .github/workflows/apply-containment-surface.yml
            git rm tools/apply-containment-surface.py
            git rm tools/containment-surface.marker
            git rm --ignore-unmatch CONTAINMENT_SURFACE_FAILURE.txt
          }
          git add -A
          git commit -m $(if ($exitCode -eq 0) { "Expose and verify process-tree containment" } else { "Record containment surface verification evidence" })
          git push origin HEAD:build/windows-job-containment
          exit $exitCode
