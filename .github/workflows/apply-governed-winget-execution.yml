name: apply-governed-winget-execution

on:
  pull_request:
    branches: [main]
    paths:
      - tools/apply-governed-winget-execution.py.gz.b64
      - .github/workflows/apply-governed-winget-execution.yml

permissions:
  contents: write

jobs:
  apply-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: build/winget-user-execution
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Apply patch and run gates
        id: gate
        shell: bash
        run: |
          set -o pipefail
          rm -f PATCH_FAILURE.txt
          {
            base64 --decode tools/apply-governed-winget-execution.py.gz.b64 | gzip --decompress > /tmp/apply-governed-winget-execution.py
            python /tmp/apply-governed-winget-execution.py
            cargo fmt --all
            cargo clippy --workspace --all-targets -- -D warnings
            cargo test --workspace
            corepack enable
            pnpm install --no-frozen-lockfile
            pnpm --dir apps/toolos-ui check
            pnpm --dir apps/toolos-ui build
          } 2>&1 | tee /tmp/toolos-gate.log
      - name: Persist failure evidence
        if: failure() && steps.gate.outcome == 'failure'
        run: |
          cp /tmp/toolos-gate.log PATCH_FAILURE.txt
          git config user.name "ToolOS Build Bot"
          git config user.email "toolos-build-bot@users.noreply.github.com"
          git add PATCH_FAILURE.txt
          git commit -m "Record governed execution patch failure"
          git push origin HEAD:build/winget-user-execution
      - name: Commit verified feature
        if: success()
        run: |
          git config user.name "ToolOS Build Bot"
          git config user.email "toolos-build-bot@users.noreply.github.com"
          git rm .github/workflows/apply-governed-winget-execution.yml
          git rm tools/apply-governed-winget-execution.py.gz.b64
          git add -A
          git commit -m "Execute governed pinned user-scope WinGet plans"
          git push origin HEAD:build/winget-user-execution
