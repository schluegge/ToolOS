name: apply-issue9-cleanup

on:
  pull_request:
    branches: [build/winget-user-execution]
    paths:
      - crates/toolos-storage/src/cleanup.rs
      - .github/workflows/apply-issue9-cleanup.yml

permissions:
  contents: write

jobs:
  verify-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: build/winget-user-execution-issue9
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Verify current cleanup slice
        id: gate
        shell: bash
        run: |
          set +e
          rm -f ISSUE9_CLEANUP_FAILURE.txt
          {
            cargo fmt --all
            cargo clippy -p toolos-daemon -p toolos-storage -p toolos-winget --all-targets -- -D warnings
            cargo test -p toolos-daemon -p toolos-storage -p toolos-winget
          } > ISSUE9_CLEANUP_FAILURE.txt 2>&1
          code=$?
          cat ISSUE9_CLEANUP_FAILURE.txt
          exit $code
      - name: Persist failure evidence
        if: failure() && steps.gate.outcome == 'failure'
        run: |
          git config user.name "ToolOS Build Bot"
          git config user.email "toolos-build-bot@users.noreply.github.com"
          git add apps/toolos-daemon crates/toolos-storage Cargo.lock ISSUE9_CLEANUP_FAILURE.txt
          git commit -m "Record complete Issue 9 cleanup diagnostics"
          git push origin HEAD:build/winget-user-execution-issue9
      - name: Commit verified cleanup workflow
        if: success()
        run: |
          git config user.name "ToolOS Build Bot"
          git config user.email "toolos-build-bot@users.noreply.github.com"
          git rm .github/workflows/apply-issue9-cleanup.yml
          git rm tools/apply-issue9-cleanup.py
          git rm --ignore-unmatch ISSUE9_CLEANUP_FAILURE.txt
          git add apps/toolos-daemon crates/toolos-storage Cargo.lock
          git commit -m "Add approved execution-disabled recovery cleanup plans"
          git push origin HEAD:build/winget-user-execution-issue9
