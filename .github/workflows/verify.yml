name: verify

on:
  push:
    branches: [main, "build/**"]
  pull_request:

permissions:
  contents: read

jobs:
  rust:
    name: Rust workspace
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: python tools/issue8_adapter_failure.py
      - run: cargo fmt --all
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - run: python -m json.tool schemas/winget-install-execution.schema.json > /dev/null

  frontend:
    name: React frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm --dir apps/toolos-ui check
      - run: pnpm --dir apps/toolos-ui build

  tauri-windows:
    name: Tauri Windows compile
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/toolos-ui/src-tauri
      - run: cargo check --manifest-path apps/toolos-ui/src-tauri/Cargo.toml

  windows-process-containment:
    name: Windows process containment
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: python tools/issue8_adapter_failure.py
      - run: cargo fmt --all
      - name: Windows workspace Clippy
        shell: pwsh
        run: |
          cargo clippy --workspace --all-targets -- -D warnings 2>&1 | Tee-Object -FilePath issue8-windows.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Unit tests
        shell: pwsh
        run: |
          cargo test -p toolos-process --lib --bins -- --nocapture 2>&1 | Tee-Object -FilePath issue8-unit-tests.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Native process-tree tests repeated five times
        shell: pwsh
        run: |
          Remove-Item issue8-native-tests.log -ErrorAction SilentlyContinue
          1..5 | ForEach-Object {
            "=== native containment pass $_ of 5 ===" | Tee-Object -FilePath issue8-native-tests.log -Append
            cargo test -p toolos-process --test windows_job_object -- --nocapture 2>&1 | Tee-Object -FilePath issue8-native-tests.log -Append
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
      - name: Windows workspace tests
        shell: pwsh
        run: |
          cargo test --workspace 2>&1 | Tee-Object -FilePath issue8-workspace-tests.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: issue8-windows-diagnostics
          path: |
            issue8-windows.log
            issue8-unit-tests.log
            issue8-native-tests.log
            issue8-workspace-tests.log
          if-no-files-found: error

  apply-verified-adapter-failure-containment:
    name: Apply verified adapter-failure containment
    if: github.event_name == 'pull_request' && github.head_ref == 'build/winget-user-execution-issue8'
    needs: [rust, frontend, tauri-windows, windows-process-containment]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: build/winget-user-execution-issue8
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: python tools/issue8_adapter_failure.py
      - run: cargo fmt --all
      - run: cargo generate-lockfile
      - name: Commit verified adapter-failure behavior
        run: |
          git config user.name "ToolOS Build Bot"
          git config user.email "toolos-build-bot@users.noreply.github.com"
          git rm tools/issue8_adapter_failure.py
          git add Cargo.lock crates/toolos-process/src/windows.rs crates/toolos-process/src/bin/toolos-process-fixture.rs crates/toolos-process/tests/windows_job_object.rs
          git commit -m "test: terminate descendants after unexpected adapter exit"
          git push origin HEAD:build/winget-user-execution-issue8
