name: verify

on:
  push:
    branches: [main, "build/**"]
  pull_request:

permissions:
  contents: read

jobs:
  rust:
    name: Rust workspace
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

  frontend:
    name: React frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: corepack enable
      - run: pnpm install --no-frozen-lockfile
      - run: pnpm --dir apps/toolos-ui check
      - run: pnpm --dir apps/toolos-ui build

  tauri-windows:
    name: Tauri Windows compile
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/toolos-ui/src-tauri
      - run: cargo check --manifest-path apps/toolos-ui/src-tauri/Cargo.toml

  windows-process-containment:
    name: Windows process containment
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: python tools/issue8_windows_fix.py
      - run: cargo fmt --all
      - name: Clippy
        shell: pwsh
        run: |
          cargo clippy -p toolos-process --all-targets -- -D warnings 2>&1 | Tee-Object -FilePath issue8-windows.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Tests
        shell: pwsh
        run: |
          cargo test -p toolos-process --all-targets -- --nocapture 2>&1 | Tee-Object -FilePath issue8-tests.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: issue8-windows-diagnostics
          path: |
            issue8-windows.log
            issue8-tests.log
            crates/toolos-process/src/windows.rs
          if-no-files-found: error

  apply-verified-process-core:
    name: Apply verified process core
    if: github.event_name == 'pull_request' && github.head_ref == 'build/winget-user-execution-issue8'
    needs: windows-process-containment
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: build/winget-user-execution-issue8
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: python tools/issue8_windows_fix.py
      - run: cargo fmt --all
      - run: cargo generate-lockfile
      - name: Commit verified source
        run: |
          git config user.name "ToolOS Build Bot"
          git config user.email "toolos-build-bot@users.noreply.github.com"
          git rm tools/issue8_windows_fix.py
          git add Cargo.lock crates/toolos-process/src/windows.rs
          git commit -m "feat: apply verified Windows process core"
          git push origin HEAD:build/winget-user-execution-issue8
