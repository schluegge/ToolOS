name: verify

on:
  push:
    branches: [main, "build/**"]
  pull_request:

permissions:
  contents: read

jobs:
  rust:
    name: Rust workspace
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

  frontend:
    name: React frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: corepack enable
      - run: pnpm install --no-frozen-lockfile
      - run: pnpm --dir apps/toolos-ui check
      - run: pnpm --dir apps/toolos-ui build

  tauri-windows:
    name: Tauri Windows compile
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/toolos-ui/src-tauri
      - run: cargo check --manifest-path apps/toolos-ui/src-tauri/Cargo.toml

  spatial-portable-probe:
    name: Spatial Window portable Linux runtime
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S ci/spatial-window-probe -B build/spatial-linux -G Ninja -DCMAKE_BUILD_TYPE=Debug
      - name: Build with warnings as errors
        run: cmake --build build/spatial-linux --parallel 2
      - name: Execute portable probe
        run: ctest --test-dir build/spatial-linux --output-on-failure

  spatial-d3d11-probe:
    name: Spatial Window native D3D11 Windows runtime
    runs-on: windows-2025
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Configure with Visual Studio 2022
        shell: pwsh
        run: cmake -S ci/spatial-window-probe -B build/spatial-windows -G "Visual Studio 17 2022" -A x64
      - name: Build with warnings as errors
        shell: pwsh
        run: cmake --build build/spatial-windows --config Debug --parallel 2
      - name: Execute portable and D3D11 WARP probes
        shell: pwsh
        run: ctest --test-dir build/spatial-windows -C Debug --output-on-failure
