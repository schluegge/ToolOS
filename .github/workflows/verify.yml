name: capture-durable-action-rustfmt

on:
  pull_request:

permissions:
  contents: read

jobs:
  rustfmt:
    name: Capture rustfmt patch
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Generate formatter patch
        run: |
          cargo fmt --all
          git diff --binary > rustfmt.patch
      - uses: actions/upload-artifact@v4
        with:
          name: durable-action-rustfmt
          path: rustfmt.patch
          if-no-files-found: error
