name: verify

on:
  push:
    branches: [main, "build/**"]
  pull_request:

permissions:
  contents: read

jobs:
  rust:
    name: Rust workspace
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Check Rust formatting
        id: rustfmt
        continue-on-error: true
        run: cargo fmt --all -- --check
      - name: Capture rustfmt patch
        if: steps.rustfmt.outcome == 'failure'
        run: |
          cargo fmt --all
          git diff --binary > rustfmt.patch
      - name: Upload rustfmt patch
        if: steps.rustfmt.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: rustfmt-patch
          path: rustfmt.patch
          if-no-files-found: error
      - name: Enforce committed formatting
        if: steps.rustfmt.outcome == 'failure'
        run: exit 1
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

  frontend:
    name: React frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: corepack enable
      - run: pnpm install --no-frozen-lockfile
      - run: pnpm --dir apps/toolos-ui check
      - run: pnpm --dir apps/toolos-ui build

  tauri-windows:
    name: Tauri Windows compile
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/toolos-ui/src-tauri
      - name: Check Tauri Windows crate
        id: tauri_check
        continue-on-error: true
        shell: pwsh
        run: |
          cargo check --manifest-path apps/toolos-ui/src-tauri/Cargo.toml *>&1 | Tee-Object -FilePath tauri-check.log
          exit $LASTEXITCODE
      - name: Upload Tauri compiler diagnostics
        if: steps.tauri_check.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: tauri-check-log
          path: tauri-check.log
          if-no-files-found: error
      - name: Enforce successful Tauri compile
        if: steps.tauri_check.outcome == 'failure'
        shell: pwsh
        run: exit 1
