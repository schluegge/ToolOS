name: verify

on:
  push:
    branches: [main, "build/**"]
  pull_request:

permissions:
  contents: read

jobs:
  rust:
    name: Rust workspace
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

  frontend:
    name: React frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: corepack enable
      - run: pnpm install --no-frozen-lockfile
      - run: pnpm --dir apps/toolos-ui check
      - run: pnpm --dir apps/toolos-ui build

  tauri-windows:
    name: Tauri Windows compile
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/toolos-ui/src-tauri
      - run: cargo check --manifest-path apps/toolos-ui/src-tauri/Cargo.toml

  spatial-protobuf-core-persistence-checkpoint18:
    name: Spatial Window protobuf Core persistence checkpoint 18
    runs-on: windows-2025
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Restore and verify exact source snapshot
        working-directory: ci/spatial-window-protobuf-core-persistence-checkpoint18
        shell: pwsh
        run: |
          & python restore_and_verify.py 2>&1 | Tee-Object -FilePath restore.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Configure with Visual Studio 2026 and static vcpkg
        shell: pwsh
        run: |
          if (-not $env:VCPKG_INSTALLATION_ROOT) { throw 'VCPKG_INSTALLATION_ROOT is unavailable' }
          $env:VCPKG_ROOT = $env:VCPKG_INSTALLATION_ROOT
          $buildDir = Join-Path $env:GITHUB_WORKSPACE 'build/spatial-protobuf-core-persistence-checkpoint18'
          New-Item -ItemType Directory -Force -Path $buildDir | Out-Null
          & cmake -S ci/spatial-window-protobuf-core-persistence-checkpoint18/source `
            -B $buildDir `
            -G "Visual Studio 18 2026" -A x64 `
            -DVCPKG_TARGET_TRIPLET=x64-windows-static `
            -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_ROOT/scripts/buildsystems/vcpkg.cmake" `
            2>&1 | Tee-Object -FilePath (Join-Path $buildDir 'configure.log')
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Build with warnings as errors
        shell: pwsh
        run: cmake --build build/spatial-protobuf-core-persistence-checkpoint18 --config Debug --parallel 2
      - name: Execute native end-to-end CTest
        shell: pwsh
        run: ctest --test-dir build/spatial-protobuf-core-persistence-checkpoint18 -C Debug --output-on-failure
      - name: Upload native evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: spatial-protobuf-core-persistence-checkpoint18-evidence
          if-no-files-found: ignore
          path: |
            ci/spatial-window-protobuf-core-persistence-checkpoint18/source-manifest.json
            ci/spatial-window-protobuf-core-persistence-checkpoint18/source-overlay.json
            ci/spatial-window-protobuf-core-persistence-checkpoint18/source-overrides/vcpkg.json.b64
            ci/spatial-window-protobuf-core-persistence-checkpoint18/source/vcpkg.json
            ci/spatial-window-protobuf-core-persistence-checkpoint18/restore.log
            build/spatial-protobuf-core-persistence-checkpoint18/configure.log
            build/spatial-protobuf-core-persistence-checkpoint18/vcpkg-manifest-install.log
            build/spatial-protobuf-core-persistence-checkpoint18/Testing/Temporary/LastTest.log
            build/spatial-protobuf-core-persistence-checkpoint18/Testing/Temporary/LastTestsFailed.log
            build/spatial-protobuf-core-persistence-checkpoint18/Debug/*.exe
            build/spatial-protobuf-core-persistence-checkpoint18/apps/core-service/Debug/*.exe
