name: verify

on:
  push:
    branches: [main, "build/**"]
  pull_request:

permissions:
  contents: read

jobs:
  rust:
    name: Rust workspace
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

  frontend:
    name: React frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: corepack enable
      - run: pnpm install --no-frozen-lockfile
      - run: pnpm --dir apps/toolos-ui check
      - run: pnpm --dir apps/toolos-ui build

  tauri-windows:
    name: Tauri Windows compile
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/toolos-ui/src-tauri
      - run: cargo check --manifest-path apps/toolos-ui/src-tauri/Cargo.toml

  spatial-named-pipe-checkpoint17:
    name: Spatial Window native named-pipe checkpoint 17
    runs-on: windows-2025
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Verify exact source hashes
        working-directory: ci/spatial-window-named-pipe-checkpoint17
        shell: pwsh
        run: python restore_and_verify.py
      - name: Configure with Visual Studio 2026
        shell: pwsh
        run: cmake -S ci/spatial-window-named-pipe-checkpoint17 -B build/spatial-named-pipe-checkpoint17 -G "Visual Studio 18 2026" -A x64
      - name: Build with warnings as errors
        shell: pwsh
        run: cmake --build build/spatial-named-pipe-checkpoint17 --config Debug --parallel 2
      - name: Execute native Windows integration test
        shell: pwsh
        run: ctest --test-dir build/spatial-named-pipe-checkpoint17 -C Debug --output-on-failure
      - name: Upload native evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: spatial-named-pipe-checkpoint17-evidence
          if-no-files-found: ignore
          path: |
            ci/spatial-window-named-pipe-checkpoint17/source-manifest.json
            build/spatial-named-pipe-checkpoint17/Testing/Temporary/LastTest.log
            build/spatial-named-pipe-checkpoint17/Testing/Temporary/LastTestsFailed.log
            build/spatial-named-pipe-checkpoint17/Debug/*.exe
