name: integrate-winget-panel-once

on:
  push:
    branches: ["feature/winget-exact-preview"]

permissions:
  contents: write

jobs:
  integrate-panel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - name: Apply bounded UI integration patch
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          app_path = Path("apps/toolos-ui/src/App.tsx")
          app = app_path.read_text(encoding="utf-8")

          if 'import { WingetPanel } from "./WingetPanel";' not in app:
              target = '} from "./api";\n'
              if app.count(target) != 1:
                  raise SystemExit(f"expected one api import terminator, found {app.count(target)}")
              app = app.replace(target, target + 'import { WingetPanel } from "./WingetPanel";\n', 1)

          nav_target = '          <a href="#archive">Archive</a>\n          <a href="#evidence">Evidence</a>'
          if '<a href="#winget">WinGet</a>' not in app:
              if app.count(nav_target) != 1:
                  raise SystemExit(f"expected one navigation target, found {app.count(nav_target)}")
              app = app.replace(
                  nav_target,
                  '          <a href="#archive">Archive</a>\n          <a href="#winget">WinGet</a>\n          <a href="#evidence">Evidence</a>',
                  1,
              )

          app = app.replace(
              '<p className="eyebrow">Milestone B · trusted state graph</p>',
              '<p className="eyebrow">Milestone C · managed machine</p>',
              1,
          )
          app = app.replace(
              '<h1>Understand the machine, project, and archive before changing them.</h1>',
              '<h1>Resolve tools and packages exactly before changing the machine.</h1>',
              1,
          )

          evidence_target = '        <section id="evidence" className="panel">'
          if '<WingetPanel disabled={status === "loading"}' not in app:
              if app.count(evidence_target) != 1:
                  raise SystemExit(f"expected one evidence section target, found {app.count(evidence_target)}")
              app = app.replace(
                  evidence_target,
                  '        <WingetPanel\n          disabled={status === "loading"}\n          onEvidence={refreshEvidence}\n        />\n\n' + evidence_target,
                  1,
              )

          app = app.replace(
              'Every machine, project, and archive claim carries scope, provider,',
              'Every machine, project, archive, and package claim carries scope, provider,',
              1,
          )
          app = app.replace(
              'Run a machine, project, or archive inspection to create evidence.',
              'Run a machine, project, archive, or package inspection to create evidence.',
              1,
          )
          app_path.write_text(app, encoding="utf-8")

          panel_path = Path("apps/toolos-ui/src/WingetPanel.tsx")
          panel = panel_path.read_text(encoding="utf-8")
          if 'import "./winget.css";' not in panel:
              target = '} from "./api";\n'
              if panel.count(target) != 1:
                  raise SystemExit(f"expected one panel api import terminator, found {panel.count(target)}")
              panel = panel.replace(target, target + 'import "./winget.css";\n', 1)
          panel_path.write_text(panel, encoding="utf-8")
          PY
      - name: Commit UI integration when changed
        shell: bash
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/toolos-ui/src/App.tsx apps/toolos-ui/src/WingetPanel.tsx
          git commit -m "feat(winget): integrate resolver panel into dashboard"
          git push origin HEAD:${{ github.ref_name }}
