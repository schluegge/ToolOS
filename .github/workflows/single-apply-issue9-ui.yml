name: single-apply-issue9-ui

on:
  pull_request:
    branches: [build/winget-user-execution]
    paths:
      - .github/workflows/single-apply-issue9-ui.yml

permissions:
  contents: write

jobs:
  apply-and-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: build/winget-user-execution-issue9
          fetch-depth: 0
      - run: git apply --check ISSUE9_RECOVERY_UI.patch
      - run: git apply ISSUE9_RECOVERY_UI.patch
      - name: Publish verified UI sources through contents API
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_BRANCH: build/winget-user-execution-issue9
        shell: bash
        run: |
          set -euo pipefail
          for path in \
            apps/toolos-ui/src/App.tsx \
            apps/toolos-ui/src/api.ts
          do
            sha=$(git rev-parse "HEAD:${path}")
            content=$(base64 -w0 "${path}")
            gh api --method PUT "repos/${GITHUB_REPOSITORY}/contents/${path}" \
              -f message="Wire verified recovery UI contracts" \
              -f content="${content}" \
              -f branch="${TARGET_BRANCH}" \
              -f sha="${sha}"
          done
