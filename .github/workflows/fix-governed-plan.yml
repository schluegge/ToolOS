name: fix-governed-plan

on:
  push:
    branches: ["feature/winget-governed-plan"]

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Apply exact fixes
        run: python .github/_fix_governed_plan.py
      - name: Format Rust workspace
        run: cargo fmt --all
      - name: Remove temporary diagnostics and mutation files
        run: |
          rm -f .github/_fix_governed_plan.py
          rm -f .github/workflows/fix-governed-plan.yml
          rm -f .github/workflows/capture-clippy.yml
      - name: Commit fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Fix governed plan approval transaction and expiry state"
          git push origin HEAD:${{ github.ref_name }}
