name: apply-issue9-daemon

on:
  pull_request:
    branches: [build/winget-user-execution]
    paths:
      - tools/apply-issue9-daemon.py
      - apps/toolos-daemon/src/recovery.rs
      - .github/workflows/apply-issue9-daemon.yml

permissions:
  contents: write

jobs:
  apply-verify-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: build/winget-user-execution-issue9
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Apply and verify daemon recovery
        id: gate
        shell: bash
        run: |
          set -o pipefail
          rm -f ISSUE9_DAEMON_FAILURE.txt
          {
            python tools/apply-issue9-daemon.py
            cargo fmt --all
            cargo clippy -p toolos-daemon -p toolos-storage -p toolos-winget --all-targets -- -D warnings
            cargo test -p toolos-daemon -p toolos-storage -p toolos-winget
          } 2>&1 | tee /tmp/issue9-daemon.log
      - name: Persist failure evidence
        if: failure() && steps.gate.outcome == 'failure'
        run: |
          cp /tmp/issue9-daemon.log ISSUE9_DAEMON_FAILURE.txt
          git config user.name "ToolOS Build Bot"
          git config user.email "toolos-build-bot@users.noreply.github.com"
          git add apps/toolos-daemon crates/toolos-storage crates/toolos-winget Cargo.lock ISSUE9_DAEMON_FAILURE.txt
          git commit -m "Record Issue 9 daemon gate failure"
          git push origin HEAD:build/winget-user-execution-issue9
      - name: Commit verified daemon recovery
        if: success()
        run: |
          git config user.name "ToolOS Build Bot"
          git config user.email "toolos-build-bot@users.noreply.github.com"
          git rm .github/workflows/apply-issue9-daemon.yml
          git rm tools/apply-issue9-daemon.py
          git rm --ignore-unmatch ISSUE9_DAEMON_FAILURE.txt
          git add apps/toolos-daemon crates/toolos-storage crates/toolos-winget Cargo.lock
          git commit -m "Journal and reconcile interrupted WinGet executions"
          git push origin HEAD:build/winget-user-execution-issue9
