name: apply-issue9-recovery-ui

on:
  pull_request:
    branches: [build/winget-user-execution]
    paths:
      - tools/apply-issue9-recovery-ui.py
      - apps/toolos-ui/src/RecoveryPanel.tsx
      - apps/toolos-ui/src/recovery-panel.css
      - schemas/winget-recovery-report.schema.json
      - schemas/winget-recovery-cleanup-plan.schema.json
      - .github/workflows/apply-issue9-recovery-ui.yml

permissions:
  contents: write

jobs:
  apply-verify-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: build/winget-user-execution-issue9
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Apply and verify recovery UI
        id: gate
        shell: bash
        run: |
          set -o pipefail
          rm -f ISSUE9_UI_FAILURE.txt
          {
            python tools/apply-issue9-recovery-ui.py
            python -m json.tool schemas/winget-recovery-report.schema.json > /dev/null
            python -m json.tool schemas/winget-recovery-cleanup-plan.schema.json > /dev/null
            corepack enable
            pnpm install --frozen-lockfile
            pnpm --dir apps/toolos-ui check
            pnpm --dir apps/toolos-ui build
            cargo fmt --all -- --check
            cargo clippy --workspace --all-targets -- -D warnings
            cargo test -p toolos-daemon -p toolos-storage -p toolos-winget
          } 2>&1 | tee /tmp/issue9-ui.log
      - name: Persist failure evidence
        if: failure() && steps.gate.outcome == 'failure'
        run: |
          cp /tmp/issue9-ui.log ISSUE9_UI_FAILURE.txt
          git config user.name "ToolOS Build Bot"
          git config user.email "toolos-build-bot@users.noreply.github.com"
          git add apps/toolos-ui .github/workflows/verify.yml schemas ISSUE9_UI_FAILURE.txt
          git commit -m "Record Issue 9 recovery UI failure"
          git push origin HEAD:build/winget-user-execution-issue9
      - name: Commit verified recovery UI
        if: success()
        run: |
          git config user.name "ToolOS Build Bot"
          git config user.email "toolos-build-bot@users.noreply.github.com"
          git add apps/toolos-ui/src/api.ts apps/toolos-ui/src/App.tsx apps/toolos-ui/src/RecoveryPanel.tsx apps/toolos-ui/src/recovery-panel.css .github/workflows/verify.yml schemas/winget-recovery-report.schema.json schemas/winget-recovery-cleanup-plan.schema.json
          git commit -m "Expose crash recovery and disabled cleanup planning"
          git push origin HEAD:build/winget-user-execution-issue9
