name: apply-provider-live-tee

on:
  pull_request:
    branches: [build/winget-user-execution]
    paths:
      - tools/provider-live-tee.marker

permissions:
  contents: write

jobs:
  apply-and-verify:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: build/windows-job-containment
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Apply live tee and verify Rust workspace
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          Remove-Item PROVIDER_LIVE_TEE_FAILURE.txt -ErrorAction SilentlyContinue
          python tools/apply-provider-live-tee.py
          cargo fmt --all
          $output = @()
          $output += (& cargo clippy --workspace --all-targets -- -D warnings 2>&1 | Out-String)
          $exitCode = $LASTEXITCODE
          if ($exitCode -eq 0) {
            $output += (& cargo test --workspace --all-targets -- --nocapture 2>&1 | Out-String)
            $exitCode = $LASTEXITCODE
          }
          if ($exitCode -ne 0) {
            $output | Set-Content PROVIDER_LIVE_TEE_FAILURE.txt -Encoding utf8
          }
          git config user.name "ToolOS Build Bot"
          git config user.email "toolos-build-bot@users.noreply.github.com"
          if ($exitCode -eq 0) {
            git rm .github/workflows/apply-provider-live-tee.yml
            git rm tools/apply-provider-live-tee.py
            git rm tools/provider-live-tee.marker
            git rm --ignore-unmatch PROVIDER_LIVE_TEE_FAILURE.txt
          }
          git add -A
          git commit -m $(if ($exitCode -eq 0) { "Preserve bounded provider output during cancellation" } else { "Record provider live-tee verification evidence" })
          git push origin HEAD:build/windows-job-containment
          exit $exitCode
