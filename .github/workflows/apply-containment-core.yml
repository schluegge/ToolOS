name: apply-containment-core

on:
  pull_request:
    branches: [build/winget-user-execution]
    paths:
      - tools/containment-core.marker

permissions:
  contents: write

jobs:
  apply-and-verify:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: build/windows-job-containment
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Apply core integration and verify
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          Remove-Item CONTAINMENT_CORE_FAILURE.txt -ErrorAction SilentlyContinue
          python tools/apply-containment-core.py
          cargo fmt --all
          $output = @()
          $output += (& cargo clippy --workspace --all-targets -- -D warnings 2>&1 | Out-String)
          $exitCode = $LASTEXITCODE
          if ($exitCode -eq 0) {
            $output += (& cargo test --workspace --all-targets -- --nocapture 2>&1 | Out-String)
            $exitCode = $LASTEXITCODE
          }
          if ($exitCode -ne 0) {
            $output | Set-Content CONTAINMENT_CORE_FAILURE.txt -Encoding utf8
          }
          git config user.name "ToolOS Build Bot"
          git config user.email "toolos-build-bot@users.noreply.github.com"
          if ($exitCode -eq 0) {
            git rm .github/workflows/apply-containment-core.yml
            git rm tools/apply-containment-core.py
            git rm tools/containment-core.marker
            git rm --ignore-unmatch CONTAINMENT_CORE_FAILURE.txt
          }
          git add -A
          git commit -m $(if ($exitCode -eq 0) { "Integrate Windows process-tree containment" } else { "Record containment integration compiler evidence" })
          git push origin HEAD:build/windows-job-containment
          exit $exitCode
