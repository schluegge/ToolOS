name: repair-windows-job

on:
  push:
    branches: [build/windows-job-containment]
    paths:
      - tools/windows-job-repair.marker

permissions:
  contents: write

jobs:
  repair:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: build/windows-job-containment
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Format, compile, and test
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          Remove-Item WINDOWS_JOB_FAILURE.txt -ErrorAction SilentlyContinue
          cargo fmt --all
          $output = @()
          $output += (& cargo clippy -p toolos-windows-job --all-targets -- -D warnings 2>&1 | Out-String)
          $exitCode = $LASTEXITCODE
          if ($exitCode -eq 0) {
            $output += (& cargo test -p toolos-windows-job --all-targets -- --nocapture 2>&1 | Out-String)
            $exitCode = $LASTEXITCODE
          }
          if ($exitCode -ne 0) {
            $output | Set-Content WINDOWS_JOB_FAILURE.txt -Encoding utf8
          }
          git config user.name "ToolOS Build Bot"
          git config user.email "toolos-build-bot@users.noreply.github.com"
          if ($exitCode -eq 0) {
            git rm .github/workflows/repair-windows-job.yml
            git rm tools/windows-job-repair.marker
            git rm --ignore-unmatch WINDOWS_JOB_FAILURE.txt
          }
          git add -A
          git commit -m $(if ($exitCode -eq 0) { "Verify Windows Job Object containment" } else { "Record Windows containment compiler evidence" })
          git push origin HEAD:build/windows-job-containment
          exit $exitCode
