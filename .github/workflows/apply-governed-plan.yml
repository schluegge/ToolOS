name: apply-governed-plan

on:
  push:
    branches: ["feature/winget-governed-plan"]

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Apply exact source transformation
        run: python .github/_apply_governed_plan.py
      - name: Format Rust workspace
        run: cargo fmt --all
      - name: Remove one-shot mutation files
        run: rm .github/_apply_governed_plan.py .github/workflows/apply-governed-plan.yml
      - name: Commit feature
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Add governed WinGet install plans and approvals"
          git push origin HEAD:${{ github.ref_name }}
