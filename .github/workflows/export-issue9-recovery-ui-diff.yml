name: export-issue9-recovery-ui-diff

on:
  pull_request:
    branches: [build/winget-user-execution]
    paths:
      - .github/workflows/export-issue9-recovery-ui-diff.yml

permissions:
  contents: write

jobs:
  export-diff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: build/winget-user-execution-issue9
          fetch-depth: 0
      - run: python tools/apply-issue9-recovery-ui.py
      - run: git diff --binary -- apps/toolos-ui/src/api.ts apps/toolos-ui/src/App.tsx .github/workflows/verify.yml > ISSUE9_RECOVERY_UI.patch
      - name: Commit diff evidence
        run: |
          git config user.name "ToolOS Build Bot"
          git config user.email "toolos-build-bot@users.noreply.github.com"
          git add ISSUE9_RECOVERY_UI.patch
          git commit -m "Export verified recovery UI patch"
          git push origin HEAD:build/winget-user-execution-issue9
