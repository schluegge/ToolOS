[workspace]
resolver = "2"
members = [
  "apps/toolos-daemon",
  "apps/toolos-cli",
  "apps/toolos-launcher",
  "crates/toolos-domain",
  "crates/toolos-storage",
  "crates/toolos-ipc",
  "crates/toolos-system",
  "crates/toolos-archive",
  "crates/toolos-winget",
  "crates/toolos-actions",
  "adapters/toolos-system-adapter",
  "adapters/toolos-winget-adapter",
]
exclude = ["apps/toolos-ui/src-tauri"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "UNLICENSED"
rust-version = "1.88"

[workspace.dependencies]
anyhow = "1"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive"] }
interprocess = { version = "2", features = ["tokio"] }
rusqlite = { version = "0", features = ["bundled"] }
rusqlite_migration = "2"
schemars = { version = "1", features = ["chrono04", "uuid1"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "json"] }
uuid = { version = "1", features = ["v4", "serde"] }
zip = { version = "=8.3.1", default-features = false, features = ["deflate"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "warn"
